[workspace]
resolver = "2"
members = ["crates/sdm-core", "crates/sdm-cli", "crates/sdm-gui"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Kevin Liu"]
repository = "https://github.com/kevl0317/SDM-Segmented-Download-Manager"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Lean, fast release binaries.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
